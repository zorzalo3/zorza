{% extends "base.html" %}
{% load i18n %}

{% block title %}
{% trans "Message sent successfully" %} - Zorza
{% endblock %}

{% block content %}
<div class="form-small text-center">
	<h2 class="text-center">&#10003; {% trans "Success" %}</h2>
	<p>{% trans "Your message was sent successfully." %}</p>
	<p id="redirect-msg" data-template="{% trans 'You will be redirected to homepage after {time} seconds' %}"></p>
</div>

<script>
(function() {
	let el = document.getElementById('redirect-msg');
	let tmpl = el.getAttribute('data-template');
	let t = 10;
	function tick() {
		el.textContent = tmpl.replace('{time}', t);
		if (t <= 1) {
			setTimeout(function() {
				window.location.href = '/';
				el.style.visibility = 'hidden';
			}, 1000);
		} else {
			t--;
			setTimeout(tick, 1000);
		}
	}
	tick();
}());
</script>

{% endblock %}
