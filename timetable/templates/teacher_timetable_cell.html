{% if lesson.group.link_to_class %}
<div class="lesson-onerow{% if lesson.overlay.kind == 'substituted' or lesson.overlay.kind == 'cancelled' or lesson.overlay.kind == 'absence' %} lesson-danger{% elif lesson.overlay.kind == 'teaching_for' %} lesson-teaching-for{% endif %}"{% if lesson.overlay.reason %} title="{{ lesson.overlay.reason }}"{% endif %}>
	{% with class=lesson.group.classes.all.0 %}
	<a class="class" href="{% url "class_timetable" class.id %}">{{ class.name }}</a>
	<span class="subject" data-subject="{{ lesson.subject.short_name }}" title="{{ lesson.subject.name }}">
		{{ lesson.subject.short_name }}
	</span>
	<a class="room" href="{% url "room_timetable" lesson.room_id %}" title="{{ lesson.room.name }}">
		{{ lesson.room.short_name }}
	</a>
	{% endwith %}
</div>
{% else %}
<div class="lesson-tworows{% if lesson.overlay.kind == 'substituted' or lesson.overlay.kind == 'cancelled' or lesson.overlay.kind == 'absence' %} lesson-danger{% elif lesson.overlay.kind == 'teaching_for' %} lesson-teaching-for{% endif %}"{% if lesson.overlay.reason %} title="{{ lesson.overlay.reason }}"{% endif %}>
	<a class="group" href="{% url "groups_timetable" lesson.group_id %}">{{ lesson.group.name }}</a>
	<a class="room" href="{% url "room_timetable" lesson.room_id %}" title="{{ lesson.room.name }}">
		{{ lesson.room.short_name }}
	</a>
	<span class="subject" data-subject="{{ lesson.subject.short_name }}" title="{{ lesson.subject.name }}">
		{{ lesson.subject.short_name }}
	</span>
</div>
{% endif %}
